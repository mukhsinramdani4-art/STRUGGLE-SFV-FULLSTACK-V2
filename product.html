<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — STRUGGLE / STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
  <style>
    .product-detail { display: grid; grid-template-columns: 1fr 1fr; gap: 48px; }
    .product-gallery { position: sticky; top: 80px; }
    .main-image { aspect-ratio: 3/4; border-radius: var(--radius-lg); overflow: hidden; background: var(--surface); margin-bottom: 12px; }
    .main-image img { width: 100%; height: 100%; object-fit: cover; }
    .thumbnails { display: flex; gap: 10px; }
    .thumb { width: 72px; aspect-ratio: 3/4; border-radius: var(--radius-sm); overflow: hidden; cursor: pointer; border: 2px solid transparent; opacity: 0.7; }
    .thumb.active, .thumb:hover { border-color: var(--primary); opacity: 1; }
    .thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-info h1 { font-size: 26px; font-weight: 700; margin-bottom: 8px; letter-spacing: -0.01em; }
    .product-info .price { font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .product-info .price-old { font-size: 16px; color: var(--text-muted); text-decoration: line-through; margin-left: 10px; }
    .product-info .material { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
    @media (max-width: 768px) { .product-detail { grid-template-columns: 1fr; gap: 24px; } .product-gallery { position: static; } }
  </style>
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo.png" alt="STRUGGLE">
        <div class="sidebar-brand-text"><span class="brand-name">STRUGGLE</span><span class="brand-sub">Studio</span></div>
      </div>
      <nav class="nav-section">
        <div class="nav-section-title">Storefront</div>
        <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Home</a>
        <a href="categories.html" class="nav-link"><span class="material-symbols-outlined">grid_view</span> Categories</a>
        <a href="deals.html" class="nav-link"><span class="material-symbols-outlined">local_offer</span> Deals</a>
        <a href="new-arrivals.html" class="nav-link"><span class="material-symbols-outlined">new_releases</span> New Arrivals</a>
        <a href="best-sellers.html" class="nav-link"><span class="material-symbols-outlined">star</span> Best Sellers</a>
        <a href="collections.html" class="nav-link"><span class="material-symbols-outlined">collections</span> Collections</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-section-title">Account</div>
        <a href="my-orders.html" class="nav-link"><span class="material-symbols-outlined">receipt_long</span> My Orders</a>
        <a href="wishlist.html" class="nav-link"><span class="material-symbols-outlined">favorite</span> Wishlist</a>
        <a href="cart.html" class="nav-link"><span class="material-symbols-outlined">shopping_bag</span> Cart</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card"><div class="user-avatar">A</div><div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
          <div class="search-box">
            <span class="material-symbols-outlined" style="color:var(--text-muted);font-size:20px">search</span>
            <input type="text" id="search-input" placeholder="Search...">
          </div>
        </div>
        <div class="header-right">
          <a href="wishlist.html" class="header-btn"><span class="material-symbols-outlined">favorite</span><span class="badge wishlist-badge" id="wishlist-count">0</span></a>
          <a href="cart.html" class="header-btn"><span class="material-symbols-outlined">shopping_bag</span><span class="badge cart-badge" id="cart-count">0</span></a>
          <a href="login.html" class="header-btn"><span class="material-symbols-outlined">person</span></a>
        </div>
      </header>

      <main class="page-content">
        <div id="product-container">
          <div class="empty-state"><span class="material-symbols-outlined">hourglass_empty</span><h3>Loading product...</h3></div>
        </div>
      </main>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    let selectedColor = null, selectedSize = null, qty = 1, currentProduct = null;

    function switchImage(src, thumb) {
      document.getElementById("main-img").src = src;
      document.querySelectorAll(".thumb").forEach(t => t.classList.remove("active"));
      if (thumb) thumb.classList.add("active");
    }

    function selectColor(name, el) {
      selectedColor = name;
      document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("selected"));
      el.classList.add("selected");
      document.getElementById("selected-color-label").textContent = name;
    }

    let selectedSleeve = null;
    function selectSleeve(sleeve, el) {
      selectedSleeve = sleeve;
      // only toggle within the sleeve option group
      const sleeveGroup = el.closest(".option-group");
      if (sleeveGroup) {
        sleeveGroup.querySelectorAll(".size-btn").forEach(b => b.classList.remove("selected"));
      }
      el.classList.add("selected");
      const lbl = document.getElementById("selected-sleeve-label");
      if (lbl) lbl.textContent = sleeve;

      // update price if sleevePrices exists
      if (currentProduct && currentProduct.sleevePrices && currentProduct.sleevePrices[sleeve]) {
        const newPrice = currentProduct.sleevePrices[sleeve];
        const priceEl = document.querySelector(".product-info .price");
        if (priceEl) {
          const oldSpan = priceEl.querySelector(".price-old");
          priceEl.innerHTML = formatPrice(newPrice) + (oldSpan ? oldSpan.outerHTML : "");
        }
      }

      // switch main image to matching sleeve if available (heuristic: ss / ls in filename)
      if (currentProduct && currentProduct.images) {
        const isLong = sleeve.toLowerCase().includes("long");
        const match = currentProduct.images.find(img => 
          isLong ? (img.includes("-ls-") || img.includes("long")) : (img.includes("-ss-") || img.includes("short") || (!img.includes("-ls-") && !img.includes("long")))
        );
        if (match) {
          document.getElementById("main-img").src = match;
          document.querySelectorAll(".thumb").forEach(t => {
            t.classList.toggle("active", t.querySelector("img")?.src?.includes(match.split("/").pop()));
          });
        }
      }
    }
    function selectSize(size, el) {
      selectedSize = size;
      // only affect size buttons in the Size option group
      const sizeGroup = el.closest(".option-group");
      if (sizeGroup) {
        sizeGroup.querySelectorAll(".size-btn").forEach(b => b.classList.remove("selected"));
      }
      el.classList.add("selected");
    }

    function updateQty(delta) {
      qty = Math.max(1, qty + delta);
      document.getElementById("qty-value").textContent = qty;
    }

    function toggleAccordion(header) {
      header.parentElement.classList.toggle("open");
    }

    function addToCart() {
      if (!currentProduct) return;
      if (!selectedSize) { App.toast("Please select a size", "error"); return; }
      Cart.add(currentProduct, { color: selectedColor, size: selectedSize, sleeve: selectedSleeve, qty });
      App.toast("Added to cart");
    }

    function toggleWish() {
      if (!currentProduct) return;
      const added = Wishlist.toggle(currentProduct.id);
      document.getElementById("wish-btn").classList.toggle("active", added);
      App.toast(added ? "Added to wishlist" : "Removed from wishlist");
    }

    document.addEventListener("DOMContentLoaded", () => Catalog.onReady(() => {
      const id = new URLSearchParams(location.search).get("id") || 1;
      currentProduct = getProductById(id);
      if (!currentProduct) {
        document.getElementById("product-container").innerHTML = `<div class="empty-state"><h3>Product not found</h3><a href="categories.html" class="btn btn-primary">Back to Shop</a></div>`;
        return;
      }

      selectedColor = currentProduct.colors[0]?.name || "";
      selectedSize = null;
      selectedSleeve = currentProduct.sleeves?.[0] || null;
      const inWish = Wishlist.has(currentProduct.id);

      document.title = currentProduct.name + " — STRUGGLE / STUDIO";

      document.getElementById("product-container").innerHTML = `
        <div class="product-detail">
          <div class="product-gallery">
            <div class="main-image"><img id="main-img" src="${currentProduct.images[0]}" alt="${currentProduct.name}"></div>
            <div class="thumbnails">
              ${currentProduct.images.map((img, i) => `
                <div class="thumb ${i===0?'active':''}" onclick="switchImage('${img}', this)">
                  <img src="${img}" alt="">
                </div>
              `).join("")}
            </div>
          </div>
          <div class="product-info">
            ${currentProduct.badge ? `<span class="product-badge" style="position:static;display:inline-block;margin-bottom:12px">${currentProduct.badge}</span>` : ""}
            <h1>${currentProduct.name}</h1>
            <div class="price">${formatPrice(currentProduct.price)}
              ${currentProduct.originalPrice ? `<span class="price-old">${formatPrice(currentProduct.originalPrice)}</span>` : ""}
            </div>
            <div class="material">${currentProduct.material}</div>

            <div class="option-group">
              <div class="option-label">Color: <span id="selected-color-label">${selectedColor}</span></div>
              <div class="color-options">
                ${currentProduct.colors.map((c,i) => `
                  <button class="color-btn ${i===0?'selected':''}" style="background:${c.hex}" title="${c.name}"
                    onclick="selectColor('${c.name}', this)"></button>
                `).join("")}
              </div>
            </div>

            <div class="option-group">
              <div class="option-label">Size</div>
              <div class="size-options">
                ${currentProduct.sizes.map(s => `
                  <button class="size-btn" onclick="selectSize('${s}', this)">${s}</button>
                `).join("")}
              </div>
            </div>

            ${currentProduct.sleeves && currentProduct.sleeves.length ? `
            <div class="option-group">
              <div class="option-label">Sleeve: <span id="selected-sleeve-label">${currentProduct.sleeves[0]}</span></div>
              <div class="size-options">
                ${currentProduct.sleeves.map((s,i) => `
                  <button class="size-btn ${i===0?'selected':''}" onclick="selectSleeve('${s}', this)">${s}</button>
                `).join("")}
              </div>
            </div>` : ""}

            <div class="option-group">
              <div class="option-label">Quantity</div>
              <div class="qty-control">
                <button onclick="updateQty(-1)">−</button>
                <span id="qty-value">1</span>
                <button onclick="updateQty(1)">+</button>
              </div>
            </div>

            <div class="flex gap-2" style="margin:24px 0">
              <button class="btn btn-primary btn-lg" style="flex:1" onclick="addToCart()">
                <span class="material-symbols-outlined">shopping_bag</span> Add to Cart
              </button>
              <button class="btn-icon" id="wish-btn" style="width:48px;height:48px;border-radius:var(--radius)" class="${inWish?'active':''}" onclick="toggleWish()">
                <span class="material-symbols-outlined">favorite</span>
              </button>
            </div>

            <div class="accordion-item open">
              <div class="accordion-header" onclick="toggleAccordion(this)">Description <span class="material-symbols-outlined">expand_more</span></div>
              <div class="accordion-body">${currentProduct.description}</div>
            </div>
            <div class="accordion-item">
              <div class="accordion-header" onclick="toggleAccordion(this)">Details & Care <span class="material-symbols-outlined">expand_more</span></div>
              <div class="accordion-body">Material: ${currentProduct.material}. Machine wash cold. Do not bleach. Tumble dry low. Iron on low heat if needed.</div>
            </div>
            <div class="accordion-item">
              <div class="accordion-header" onclick="toggleAccordion(this)">Shipping & Returns <span class="material-symbols-outlined">expand_more</span></div>
              <div class="accordion-body">Free shipping on orders over Rp 500.000. Standard delivery 3–7 business days. Easy returns within 14 days of delivery.</div>
            </div>
          </div>
        </div>
      `;
    }));
  </script>
</body>
</html>
