<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — STRUGGLE / STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg); margin: 0; }
    .auth-wrap { width: 100%; max-width: 420px; padding: 20px; }
    .login-card { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px 32px; box-shadow: var(--shadow-lg); }
    .login-logo { text-align: center; margin-bottom: 28px; }
    .login-logo img { width: 72px; height: 72px; border-radius: 50%; margin: 0 auto 12px; display: block; object-fit: cover; }
    .login-logo h1 { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; margin: 0; }
    .login-logo p { font-size: 11px; color: var(--text-muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--bg); border-radius: 10px; padding: 4px; }
    .auth-tab { flex: 1; padding: 10px; border: none; background: transparent; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer; color: var(--text-muted); transition: all 0.2s; }
    .auth-tab.active { background: var(--bg-elevated); color: var(--text); box-shadow: var(--shadow-sm); }
    .auth-panel { display: none; }
    .auth-panel.active { display: block; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 6px; color: var(--text-muted); }
    .form-input { width: 100%; padding: 12px 14px; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text); font-size: 14px; box-sizing: border-box; }
    .form-input:focus { outline: none; border-color: var(--primary); }
    .btn-block { width: 100%; margin-top: 8px; }
    .auth-footer { text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted); }
    .auth-footer a { color: var(--primary); font-weight: 600; text-decoration: none; }
    .demo-hint { margin-top: 16px; padding: 12px; background: rgba(99,102,241,0.08); border-radius: 8px; font-size: 12px; color: var(--text-muted); line-height: 1.5; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="assets/images/logo.png" alt="SFV">
        <h1>SFV · STUDIO</h1>
        <p>Struggle For Victory</p>
      </div>

      <div class="auth-tabs" id="auth-tabs" style="display:none">
        <button class="auth-tab active" data-tab="login" id="tab-login">Masuk</button>
        <button class="auth-tab" data-tab="register" id="tab-register">Buat Akun</button>
      </div>

      <div id="must-msg" class="notice info" style="display:none"></div>

      <div class="auth-panel active" id="panel-login">
        <form id="login-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="login-id">Username atau Email</label>
            <input class="form-input" id="login-id" type="text" placeholder="mis. pelanggan01" autocomplete="username" autocapitalize="none" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password">Password</label>
            <input class="form-input" id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" required>
          </div>
          <div id="login-error" class="notice bad" style="display:none"></div>
          <button class="btn btn-primary btn-block" type="submit" id="btn-login">Masuk</button>
        </form>
        <div class="demo-hint" id="forgot-hint">Lupa password atau belum punya akun? Hubungi admin kelompok untuk akun/reset password. <a id="wa-link" href="#" target="_blank" rel="noopener" style="display:none">Chat WhatsApp admin</a></div>
      </div>

      <div class="auth-panel" id="panel-register">
        <form id="reg-form" novalidate>
          <div class="form-group"><label class="form-label" for="reg-name">Nama lengkap</label><input class="form-input" id="reg-name" type="text" required></div>
          <div class="form-group"><label class="form-label" for="reg-email">Email</label><input class="form-input" id="reg-email" type="email" required></div>
          <div class="form-group"><label class="form-label" for="reg-phone">Telepon</label><input class="form-input" id="reg-phone" type="tel"></div>
          <div class="form-group"><label class="form-label" for="reg-password">Password (min. 8 karakter)</label><input class="form-input" id="reg-password" type="password" autocomplete="new-password" required></div>
          <div class="form-group"><label class="form-label" for="reg-confirm">Ulangi password</label><input class="form-input" id="reg-confirm" type="password" autocomplete="new-password" required></div>
          <div id="reg-error" class="notice bad" style="display:none"></div>
          <button class="btn btn-primary btn-block" type="submit">Buat Akun</button>
        </form>
      </div>

      <div class="auth-footer">
        <a href="index.html" data-i18n="backToStore">← Back to store</a>
      </div>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  const params = new URLSearchParams(location.search);
  const redirectTo = (() => { const r = params.get("redirect") || "index.html"; return /^[a-zA-Z0-9_\-.?=&%]+$/.test(r) && !r.includes("//") ? r : "index.html"; })();
  const showErr = (id, msg) => { const e = document.getElementById(id); e.textContent = msg; e.style.display = msg ? "" : "none"; };

  document.addEventListener("DOMContentLoaded", () => {
    Auth.whenReady(u => { if (u) location.replace(u.mustChangePassword ? "account-settings.html#password" : redirectTo); });
    Catalog.onReady(() => {
      const cfg = Catalog.config;
      if (cfg && cfg.features.allowRegistration) document.getElementById("auth-tabs").style.display = "";
      if (cfg && cfg.store.whatsapp) { const a = document.getElementById("wa-link"); a.href = "https://wa.me/" + cfg.store.whatsapp; a.style.display = ""; }
    });
    document.querySelectorAll(".auth-tab").forEach(t => t.onclick = () => {
      document.querySelectorAll(".auth-tab").forEach(x => x.classList.toggle("active", x === t));
      document.querySelectorAll(".auth-panel").forEach(p => p.classList.toggle("active", p.id === "panel-" + t.dataset.tab));
    });
    document.getElementById("login-form").addEventListener("submit", async e => {
      e.preventDefault();
      const btn = document.getElementById("btn-login"); btn.disabled = true; showErr("login-error", "");
      const r = await Auth.login(document.getElementById("login-id").value.trim(), document.getElementById("login-password").value);
      btn.disabled = false;
      if (!r.ok) return showErr("login-error", r.error);
      location.href = r.user.mustChangePassword ? "account-settings.html#password" : redirectTo;
    });
    document.getElementById("reg-form").addEventListener("submit", async e => {
      e.preventDefault(); showErr("reg-error", "");
      const v = id => document.getElementById(id).value.trim();
      if (document.getElementById("reg-password").value !== document.getElementById("reg-confirm").value) return showErr("reg-error", "Konfirmasi password tidak sama.");
      const r = await Auth.register({ name: v("reg-name"), email: v("reg-email"), phone: v("reg-phone"), password: document.getElementById("reg-password").value });
      if (!r.ok) return showErr("reg-error", r.error);
      const l = await Auth.login(v("reg-email"), document.getElementById("reg-password").value);
      if (l.ok) location.href = redirectTo;
    });
  });
  </script>
</body>
</html>
