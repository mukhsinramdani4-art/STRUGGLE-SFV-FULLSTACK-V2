<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart — STRUGGLE / STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo.png" alt="STRUGGLE">
        <div class="sidebar-brand-text"><span class="brand-name">SFV</span><span class="brand-sub">Studio</span></div>
      </div>
      <nav class="nav-section">
        <div class="nav-section-title">Storefront</div>
        <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Home</a>
        <a href="categories.html" class="nav-link"><span class="material-symbols-outlined">grid_view</span> Categories</a>
        <a href="deals.html" class="nav-link"><span class="material-symbols-outlined">local_offer</span> Deals</a>
        <a href="new-arrivals.html" class="nav-link"><span class="material-symbols-outlined">new_releases</span> New Arrivals</a>
        <a href="best-sellers.html" class="nav-link"><span class="material-symbols-outlined">star</span> Best Sellers</a>
        <a href="collections.html" class="nav-link"><span class="material-symbols-outlined">collections</span> Collections</a>
      </nav>
      <nav class="nav-section">
        <div class="nav-section-title">Account</div>
        <a href="my-orders.html" class="nav-link"><span class="material-symbols-outlined">receipt_long</span> My Orders</a>
        <a href="wishlist.html" class="nav-link"><span class="material-symbols-outlined">favorite</span> Wishlist</a>
        <a href="cart.html" class="nav-link active"><span class="material-symbols-outlined">shopping_bag</span> Cart</a>
      </nav>
      <div class="sidebar-footer">
        <div class="user-card"><div class="user-avatar">A</div><div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div></div>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <div class="main-content">
      <header class="header">
        <div class="header-left">
          <button class="sidebar-toggle" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
          <div class="search-box">
            <span class="material-symbols-outlined" style="color:var(--text-muted);font-size:20px">search</span>
            <input type="text" id="search-input" placeholder="Search...">
          </div>
        </div>
        <div class="header-right">
          <a href="wishlist.html" class="header-btn"><span class="material-symbols-outlined">favorite</span><span class="badge wishlist-badge" id="wishlist-count">0</span></a>
          <a href="cart.html" class="header-btn"><span class="material-symbols-outlined">shopping_bag</span><span class="badge cart-badge" id="cart-count">0</span></a>
          <a href="login.html" class="header-btn"><span class="material-symbols-outlined">person</span></a>
        </div>
      </header>

      <main class="page-content">
        <div class="page-header">
          <h1>Shopping Bag</h1>
          <p id="cart-count-text">Your selected pieces</p>
        </div>

        <div id="cart-content"></div>
      </main>
    </div>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    function renderCart() {
      const items = Cart.get();
      const el = document.getElementById("cart-content");
      document.getElementById("cart-count-text").textContent = items.length ? `${Cart.count()} item(s) in your bag` : "Your bag is empty";

      if (!items.length) {
        el.innerHTML = `
          <div class="empty-state">
            <span class="material-symbols-outlined">shopping_bag</span>
            <h3>Your bag is empty</h3>
            <p>Discover our minimalist essentials and start building your wardrobe.</p>
            <a href="categories.html" class="btn btn-primary">Continue Shopping</a>
          </div>`;
        return;
      }

      const subtotal = Cart.subtotal();

      el.innerHTML = `
        <div class="grid-2" style="align-items:start">
          <div>
            ${items.map((item, i) => `
              <div class="cart-item">
                <div class="cart-item-img"><img src="${item.image}" alt="${item.name}"></div>
                <div class="cart-item-info">
                  <h3>${item.name}</h3>
                  <div class="cart-item-meta">${[item.color, item.size, item.sleeve, item.material].filter(Boolean).join(" · ")}</div>
                  <div class="qty-control">
                    <button onclick="changeQty(${i},-1)">−</button>
                    <span>${item.qty}</span>
                    <button onclick="changeQty(${i},1)">+</button>
                  </div>
                </div>
                <div class="cart-item-price">
                  <div class="price">${formatPrice(item.price * item.qty)}</div>
                  <button class="btn-ghost btn-sm mt-1" onclick="removeItem(${i})" style="color:var(--error)">Remove</button>
                </div>
              </div>
            `).join("")}
            <a href="categories.html" class="btn btn-secondary mt-3">Continue Shopping</a>
          </div>
          <div class="cart-summary">
            <h3>Order Summary</h3>
            <div class="summary-row"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <div class="summary-row"><span>Ongkir</span><span style="color:var(--text-muted);font-size:13px">Dihitung di checkout</span></div>
            <div class="summary-row total"><span>Subtotal</span><span>${formatPrice(subtotal)}</span></div>
            <p style="font-size:12px;color:var(--text-muted);margin-top:8px">Ongkir bergantung pada alamat tujuan, berat, dan ekspedisi yang Anda pilih.</p>
            <a href="checkout.html" class="btn btn-primary w-full mt-3">Proceed to Checkout</a>
          </div>
        </div>
      `;
    }

    function changeQty(index, delta) {
      const items = Cart.get();
      Cart.updateQty(index, items[index].qty + delta);
      renderCart();
      App.toast("Quantity updated");
    }

    function removeItem(index) {
      Cart.remove(index);
      renderCart();
      App.toast("Removed from cart");
    }

    document.addEventListener("DOMContentLoaded", () => {
      Auth.requireLogin().then(ok => { if (ok) renderCart(); });
    });
    document.addEventListener("cartUpdated", renderCart);
  </script>
</body>
</html>
