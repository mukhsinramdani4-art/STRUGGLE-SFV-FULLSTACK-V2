<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coupons — STRUGGLE / STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
</head>
<body>
<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><img src="assets/images/logo.png" alt="STRUGGLE"><div class="sidebar-brand-text"><span class="brand-name">SFV</span><span class="brand-sub">Studio</span></div></div>
  <nav class="nav-section">
    <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Home</a>
    <a href="coupons.html" class="nav-link active"><span class="material-symbols-outlined">confirmation_number</span> Coupons</a>
    <a href="my-orders.html" class="nav-link"><span class="material-symbols-outlined">receipt_long</span> My Orders</a>
  </nav>
  <div class="sidebar-footer"><div class="user-card"><div class="user-avatar">A</div><div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="main-content">
  <header class="header">
    <div class="header-left"><button class="sidebar-toggle" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button></div>
    <div class="header-right"><a href="cart.html" class="header-btn"><span class="material-symbols-outlined">shopping_bag</span><span class="badge cart-badge" id="cart-count">0</span></a></div>
  </header>
  <main class="page-content">
    <div class="page-header"><h1>Coupons & Vouchers</h1><p>Save more with exclusive offers</p></div>
    <div id="coupons-list"></div>
  </main>
</div>
</div>
<script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/wishlist.js"></script><script src="assets/js/checkout.js"></script><script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>Catalog.onReady(()=>{
  document.getElementById("coupons-list").innerHTML = COUPONS.length ? COUPONS.map(c=>`
    <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px">
      <div>
        <div style="font-weight:700;font-size:18px;letter-spacing:0.04em;color:var(--primary)">${c.code}</div>
        <div style="margin:6px 0">${c.description}</div>
        <div class="text-muted" style="font-size:13px">Berlaku s/d ${c.validUntil || '-'} · Min. belanja ${formatPrice(c.minPurchase||0)}</div>
      </div>
      <button class="btn btn-primary btn-sm" onclick="navigator.clipboard.writeText('${c.code}');App.toast('Code copied: ${c.code}')">Copy Code</button>
    </div>
  `).join("") : `<div class="empty-state"><span class="material-symbols-outlined">sell</span><h3>Belum ada kupon aktif</h3><p>Kupon yang dibuat admin akan tampil di sini.</p></div>`;
}));
</script>
</body></html>
