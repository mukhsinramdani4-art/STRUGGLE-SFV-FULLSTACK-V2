<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections — STRUGGLE / STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
</head>
<body>
<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><img src="assets/images/logo.png" alt="STRUGGLE"><div class="sidebar-brand-text"><span class="brand-name">SFV</span><span class="brand-sub">Studio</span></div></div>
  <nav class="nav-section">
    <div class="nav-section-title">Storefront</div>
    <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Home</a>
    <a href="categories.html" class="nav-link"><span class="material-symbols-outlined">grid_view</span> Categories</a>
    <a href="deals.html" class="nav-link"><span class="material-symbols-outlined">local_offer</span> Deals</a>
    <a href="new-arrivals.html" class="nav-link"><span class="material-symbols-outlined">new_releases</span> New Arrivals</a>
    <a href="best-sellers.html" class="nav-link"><span class="material-symbols-outlined">star</span> Best Sellers</a>
    <a href="collections.html" class="nav-link active"><span class="material-symbols-outlined">collections</span> Collections</a>
  </nav>
  <div class="sidebar-footer"><div class="user-card"><div class="user-avatar">A</div><div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="main-content">
  <header class="header">
    <div class="header-left"><button class="sidebar-toggle" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
    <div class="search-box"><span class="material-symbols-outlined" style="color:var(--text-muted);font-size:20px">search</span><input type="text" id="search-input" placeholder="Search..."></div></div>
    <div class="header-right">
      <a href="wishlist.html" class="header-btn"><span class="material-symbols-outlined">favorite</span><span class="badge wishlist-badge" id="wishlist-count">0</span></a>
      <a href="cart.html" class="header-btn"><span class="material-symbols-outlined">shopping_bag</span><span class="badge cart-badge" id="cart-count">0</span></a>
    </div>
  </header>
  <main class="page-content">
    <div class="page-header"><h1>Collections</h1><p>Curated series for every mood and season</p></div>
    <div class="collection-grid" id="col-grid" style="margin-bottom:40px"></div>
    <div class="product-grid" id="product-grid"></div>
  </main>
</div>
</div>
<script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script><script src="assets/js/cart.js"></script><script src="assets/js/wishlist.js"></script><script src="assets/js/checkout.js"></script><script src="assets/js/app.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>Catalog.onReady(()=>{
  const id = new URLSearchParams(location.search).get("id");
  document.getElementById("col-grid").innerHTML = COLLECTIONS.map(c=>`
    <a href="collections.html?id=${c.id}" class="collection-card">
      <img src="${c.image}" alt="${c.name}"><div class="collection-card-overlay"><h3>${c.name}</h3><p>${c.description}</p></div>
    </a>`).join("");
  const list = id ? getCollectionProducts(id) : PRODUCTS;
  document.getElementById("product-grid").innerHTML = list.map(p=>App.renderProductCard(p)).join("");
}));
</script>
</body></html>
