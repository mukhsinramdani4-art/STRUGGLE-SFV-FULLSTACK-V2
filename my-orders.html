<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Orders — STRUGGLE / STUDIO</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/shop.css">
  <link rel="icon" href="assets/images/logo.png">
</head>
<body>
<div class="app-layout">
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand"><img src="assets/images/logo.png" alt="STRUGGLE"><div class="sidebar-brand-text"><span class="brand-name">SFV</span><span class="brand-sub">Studio</span></div></div>
  <nav class="nav-section">
    <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> Home</a>
    <a href="categories.html" class="nav-link"><span class="material-symbols-outlined">grid_view</span> Categories</a>
    <a href="my-orders.html" class="nav-link active"><span class="material-symbols-outlined">receipt_long</span> My Orders</a>
    <a href="wishlist.html" class="nav-link"><span class="material-symbols-outlined">favorite</span> Wishlist</a>
  </nav>
  <div class="sidebar-footer"><div class="user-card"><div class="user-avatar">A</div><div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div></div></div>
</aside>
<div class="sidebar-overlay" id="sidebar-overlay"></div>
<div class="main-content">
  <header class="header">
    <div class="header-left"><button class="sidebar-toggle" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
    <div class="search-box"><span class="material-symbols-outlined" style="color:var(--text-muted);font-size:20px">search</span><input type="text" id="search-input" placeholder="Search..."></div></div>
    <div class="header-right">
      <a href="cart.html" class="header-btn"><span class="material-symbols-outlined">shopping_bag</span><span class="badge cart-badge" id="cart-count">0</span></a>
    </div>
  </header>
  <main class="page-content">
    <div class="page-header"><h1>Riwayat Pesanan</h1><p>Pantau status pesanan, pembayaran, dan pengiriman Anda</p></div>
    <div id="orders-list"><div class="skeleton" style="height:140px;border-radius:16px"></div></div>
  </main>
</div>
</div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
  document.addEventListener("DOMContentLoaded", async () => {
    if (!(await Auth.requireLogin())) return;
    const box = document.getElementById("orders-list");
    try {
      const orders = await Orders.list();
      if (!orders.length) { box.innerHTML = `<div class="empty-state"><span class="material-symbols-outlined">receipt_long</span><h3>Belum ada pesanan</h3><p>Pesanan Anda akan tampil di sini.</p><a href="categories.html" class="btn btn-primary">Mulai Belanja</a></div>`; return; }
      box.innerHTML = orders.map(o => `
        <a class="order-card" href="order.html?id=${encodeURIComponent(o.id)}" style="display:block;color:inherit;text-decoration:none">
          <div class="order-card-head"><div><b>${esc(o.id)}</b><div style="font-size:12.5px;color:var(--text-muted)">${fmtDateTime(o.created_at)}</div></div><b>${formatPrice(o.total)}</b></div>
          <div style="font-size:13.5px;margin-bottom:10px">${(o.items || []).map(i => esc(i.product_name) + " ×" + i.qty).join(", ")}</div>
          <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${statusPill(o.status)} ${statusPill(o.payment_status)} ${statusPill(o.shipping_status)}
            <span style="font-size:12.5px;color:var(--text-muted)">${esc(o.courier_name || "")} ${esc(o.service_name || "")}${o.tracking_number ? " · Resi " + esc(o.tracking_number) : ""}</span></div>
        </a>`).join("");
    } catch (e) { box.innerHTML = `<div class="notice bad">${esc(e.message)}</div>`; }
  });
  </script>
</body>
</html>
