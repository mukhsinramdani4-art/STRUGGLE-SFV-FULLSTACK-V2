<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — STRUGGLE / STUDIO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="icon" href="assets/images/logo.png">
</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <img src="assets/images/logo.png" alt="SFV">
        <div class="sidebar-brand-text">
          <span class="brand-name">SFV</span>
          <span class="brand-sub">Studio</span>
        </div>
      </div>
      <nav class="nav-section">
        <div class="nav-section-title">Storefront</div>
        <a href="index.html" class="nav-link"><span class="material-symbols-outlined">home</span> <span data-i18n="home">Home</span></a>
        <a href="categories.html" class="nav-link active"><span class="material-symbols-outlined">grid_view</span> <span data-i18n="categories">Categories</span></a>
        <a href="deals.html" class="nav-link"><span class="material-symbols-outlined">local_offer</span> <span data-i18n="deals">Deals</span></a>
        <a href="new-arrivals.html" class="nav-link"><span class="material-symbols-outlined">new_releases</span> <span data-i18n="newArrivals">New Arrivals</span></a>
        <a href="best-sellers.html" class="nav-link"><span class="material-symbols-outlined">star</span> <span data-i18n="bestSellers">Best Sellers</span></a>
      </nav>
      <nav class="nav-section">
        <div class="nav-section-title">Account</div>
        <a href="my-orders.html" class="nav-link" data-require-auth><span class="material-symbols-outlined">receipt_long</span> <span data-i18n="myOrders">My Orders</span></a>
        <a href="wishlist.html" class="nav-link" data-require-auth><span class="material-symbols-outlined">favorite</span> <span data-i18n="wishlist">Wishlist</span></a>
        <a href="account-settings.html" class="nav-link" data-require-auth><span class="material-symbols-outlined">settings</span> <span data-i18n="accountSettings">Account Settings</span></a>
      </nav>
      <div class="sidebar-footer">
        <div class="lang-switcher">
          <button data-lang="en" class="lang-btn active">EN</button>
          <button data-lang="id" class="lang-btn">ID</button>
        </div>
        <div class="user-card">
          <div class="user-avatar"><span class="material-symbols-outlined">person</span></div>
          <div class="user-info"><div class="user-name">Guest</div><div class="user-role">Sign in</div></div>
        </div>
        <a href="login.html" class="btn btn-outline btn-sm w-full" data-auth-show="guest" style="margin-top:12px" data-i18n="login">Login</a>
        <button class="btn btn-outline btn-sm w-full" data-auth-show="logged" style="margin-top:12px;display:none" onclick="App.logout()" data-i18n="logout">Logout</button>
      </div>
    </aside>
    <div class="sidebar-overlay" id="sidebar-overlay"></div>

    <main class="main-content">
      <header class="topbar">
        <button class="btn-icon" id="sidebar-toggle"><span class="material-symbols-outlined">menu</span></button>
        <div class="search-bar">
          <span class="material-symbols-outlined">search</span>
          <input type="search" id="search-input" data-i18n-placeholder="searchPlaceholder" placeholder="Search products...">
        </div>
        <div class="topbar-actions">
          <a href="cart.html" class="btn-icon" data-require-auth>
            <span class="material-symbols-outlined">shopping_bag</span>
            <span class="cart-badge badge-count" id="cart-count" style="display:none">0</span>
          </a>
        </div>
      </header>

      <div class="section-header" style="margin-bottom:20px">
        <h1 style="font-size:22px;margin:0" data-i18n="categories">Categories</h1>
      </div>

      <div class="category-chips" id="filter-chips" style="margin-bottom:24px"></div>

      <div class="product-grid" id="products-grid"></div>
    </main>
  </div>

  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/products.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/checkout.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    let currentCat = params.get("cat") || "all";
    const searchQ = (params.get("q") || "").toLowerCase();

    function render() {
      const chips = document.getElementById("filter-chips");
      chips.innerHTML = CATEGORIES.map(c => `
        <a href="?cat=${c.id}" class="chip ${currentCat === c.id ? "active" : ""}" style="${currentCat===c.id ? "border-color:var(--primary);background:var(--primary-soft);color:var(--primary)" : ""}">
          <span class="material-symbols-outlined">${c.icon}</span>
          <span>${c.name || _(c.nameKey)}</span>
          <span class="chip-count">${getCategoryCount(c.id)}</span>
        </a>
      `).join("");

      let list = getProductsByCategory(currentCat);
      if (searchQ) {
        list = list.filter(p =>
          p.name.toLowerCase().includes(searchQ) ||
          (p.material || "").toLowerCase().includes(searchQ) ||
          (p.description || "").toLowerCase().includes(searchQ)
        );
      }
      document.getElementById("products-grid").innerHTML = list.length
        ? list.map(p => App.renderProductCard(p)).join("")
        : `<p class="text-muted" style="padding:40px;text-align:center">${_("loading")}</p>`;
    }

    document.addEventListener("DOMContentLoaded", () => Catalog.onReady(render));
  </script>
</body>
</html>
